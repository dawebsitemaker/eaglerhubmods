<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>EaglerHubMods Admin</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;margin:20px} .mod{padding:6px;border:1px solid #ddd;margin:6px}</style>
</head>
<body>
  <h1>EaglerHubMods Admin</h1>
  <div id="mods"></div>
  <button id="launch">Launch Eaglercraft with selected mods</button>
  <script>
    async function loadMods(){
      let res = await fetch('/api/mods');
      let list = await res.json();
      let container = document.getElementById('mods');
      container.innerHTML = '';
      list.forEach(m => {
        let d = document.createElement('div'); d.className='mod';
        let cb = document.createElement('input'); cb.type='checkbox'; cb.value = m.name; cb.dataset.path = m.path;
        d.appendChild(cb);
        let lbl = document.createElement('span'); lbl.textContent = ' ' + m.name + ' ('+m.type+')'; d.appendChild(lbl);
        container.appendChild(d);
      });
    }
    document.getElementById('launch').addEventListener('click', ()=>{
      let checks = Array.from(document.querySelectorAll('#mods input[type=checkbox]:checked'));
      let names = checks.map(c=>c.value).join(',');
      window.open('/launch?mods='+encodeURIComponent(names), '_blank');
    });
    loadMods();
  </script>
</body>
</html>
